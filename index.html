<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>플라스틱 배출량 기반 과세 — 복습 서바이버</title>
<meta name="description" content="플라스틱세 발표 복습용 참여형 서바이버 게임">
<style>
  :root{
    --ink:#e8eef6; --dim:#8b9bb0; --acc:#3ddc97; --acc2:#4cc9f0;
    --warn:#ff6b6b; --gold:#ffd166; --bg:#0b0f16; --card:#121821; --line:#243044;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#070a10;overflow:hidden;
    font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',system-ui,sans-serif;
    color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
  #wrap{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}
  #frame{position:relative;line-height:0}
  canvas{display:block;background:#0a1220;width:100%;height:100%}
  .layer{position:absolute;inset:0;pointer-events:none}

  /* HUD — 얇은 한 줄 */
  #hud{position:absolute;left:0;right:0;top:0;padding:8px 12px;pointer-events:none}
  #xpwrap{height:3px;background:#161d28;margin-bottom:8px}
  #xpIn{height:100%;width:0%;background:var(--acc2)}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:13px}
  #roundName{font-weight:700;color:var(--acc)}
  #roundSub{color:var(--dim)}
  #whoNow{color:var(--gold)}
  #timeBig{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums;font-size:18px}
  #hpwrap{width:140px;height:8px;background:#1a2230;overflow:hidden;position:relative}
  #hpIn{height:100%;width:100%;background:var(--acc)}
  #hpwrap .lab{position:absolute;inset:0;font-size:9px;display:grid;place-items:center;
    color:#04140e;font-weight:700}
  #livesHud{color:#ff8fa3;font-weight:800;letter-spacing:1px;min-width:2.2em}
  #hud .skip{pointer-events:auto;cursor:pointer;background:none;border:0;color:var(--dim);
    font:inherit;font-size:13px;padding:0}
  #hud .skip:hover{color:var(--ink)}

  /* 오버레이 — 어두운 배경 + 단순한 패널 */
  .ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(7,10,16,.82);z-index:20;padding:4vh 4vw}
  .ov.on{display:flex}
  .card{width:min(640px,94vw);max-height:92vh;overflow:auto;background:var(--card);
    border:1px solid var(--line);padding:28px 28px 24px}
  #quiz .card, #end .card{width:min(780px,94vw)}
  .eyebrow{color:var(--dim);font-size:12px;margin-bottom:6px}
  .eyebrow.op,.eyebrow.hardq{color:var(--gold)}
  .card h1{margin:0 0 6px;font-size:clamp(20px,2.4vw,30px);font-weight:700;line-height:1.3}
  .card h2{margin:0 0 14px;font-size:14px;color:var(--dim);font-weight:500;line-height:1.5}
  .card b{color:var(--gold);font-weight:700} .card .em{color:var(--acc2);font-weight:600}

  .opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
  @media(max-width:780px){.opts{grid-template-columns:1fr}}
  .opt{pointer-events:auto;cursor:pointer;text-align:left;background:#0e141d;
    border:1px solid var(--line);color:var(--ink);padding:12px 14px;font:inherit;
    font-size:15px;display:flex;gap:10px;align-items:center;line-height:1.4}
  .opt:hover{border-color:#4a6288}
  .opt .n{width:22px;height:22px;flex:none;background:#1c2736;display:grid;
    place-items:center;font-size:12px;color:var(--dim)}
  .opt.right{background:#10281e;border-color:var(--acc)}
  .opt.wrong{background:#2a1218;border-color:var(--warn)}
  .opt.chosen{background:#2a2410;border-color:var(--gold)}
  .opt[disabled]{cursor:default}
  .verdict{margin-top:14px;font-size:15px;line-height:1.6;display:none;color:var(--dim)}
  .verdict.on{display:block}
  .verdict.bad{color:#ffb4b4}
  .verdict.op{color:var(--gold)}

  .btn{pointer-events:auto;cursor:pointer;margin-top:16px;background:var(--acc);color:#04231a;border:0;
    padding:10px 18px;font:inherit;font-weight:700;font-size:15px}
  .btn.ghost{background:transparent;color:var(--dim);border:1px solid var(--line);margin-left:8px}
  .btn.gold{background:var(--gold);color:#2a2410}

  #title .card{text-align:center;width:min(560px,94vw)}
  #title h1{font-size:clamp(22px,3.2vw,34px)}
  .keys{margin-top:10px;color:var(--dim);font-size:12px}
  kbd{border:1px solid var(--line);padding:1px 5px;font-size:11px;font-family:inherit;color:var(--ink)}

  .ucards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
  @media(max-width:820px){.ucards{grid-template-columns:1fr}}
  .ucard{pointer-events:auto;cursor:pointer;background:#0e141d;border:1px solid var(--line);
    padding:16px 12px;color:var(--ink);font:inherit;text-align:center;display:flex;
    flex-direction:column;align-items:center;gap:4px}
  .ucard:hover{border-color:var(--acc2)}
  .ucard .ico{font-size:26px;line-height:1}
  .ucard .cat{font-size:11px;color:var(--acc)}
  .ucard .nm{font-size:16px;font-weight:700}
  .ucard .ds{font-size:12px;color:var(--dim);line-height:1.4}
  .ucard .lv{font-size:11px;color:var(--gold)}
  .uplist{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .uplist span{color:var(--dim);font-size:12px}

  .diffpick{display:flex;gap:6px;justify-content:center;margin-top:16px}
  .diffpick button{pointer-events:auto;cursor:pointer;background:transparent;border:1px solid var(--line);
    color:var(--dim);padding:8px 14px;font:inherit;font-size:13px}
  .diffpick button.sel{border-color:var(--acc);color:var(--ink)}
  .diffpick button span{display:none}

  .pick{margin-top:14px}
  .pick input{pointer-events:auto;width:min(260px,100%);background:#0e141d;border:1px solid var(--line);
    color:var(--ink);padding:10px 12px;font:inherit;font-size:15px;outline:none;text-align:center}
  .pick input:focus{border-color:var(--acc2)}

  .review{margin:10px 0 0;padding:0;list-style:none;text-align:left}
  .review li{border-top:1px solid var(--line);padding:10px 0}
  .review li:first-child{border-top:none}
  .review .q{font-size:15px;margin-bottom:4px}
  .review .a{color:var(--acc);font-size:13px}
  .review .m{color:var(--dim);font-size:13px;margin-top:2px;line-height:1.5}
  .review .pick2{color:var(--gold);font-size:13px}
  .scoreline{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--dim)}
  .scoreline b{color:var(--ink);font-size:16px;margin-left:6px}
  .ptable{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}
  .ptable th{color:var(--dim);font-weight:500;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  .ptable td{padding:6px 8px;border-bottom:1px solid #1a2230}
  .ptable.chrono tbody tr.win td{color:var(--gold)}
  .prize{margin-top:12px;font-size:15px}
  .prize .pname{font-weight:700}
  .prize .pval{color:var(--gold);font-weight:800;margin-left:8px}
  .prize .pdesc{color:var(--dim);font-size:13px;margin-top:4px}

  #toast{position:absolute;left:50%;top:52px;transform:translateX(-50%);color:var(--ink);
    font-size:13px;opacity:0;transition:opacity .2s;z-index:15;white-space:nowrap;pointer-events:none;
    text-shadow:0 1px 6px #000}
  #toast.on{opacity:1}

  #stick{position:absolute;left:0;right:0;bottom:0;height:160px;display:none;z-index:12}
  @media(pointer:coarse){#stick{display:block}}

  .deathbtns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px}
  .patbadge{position:absolute;left:50%;bottom:58px;transform:translateX(-50%);
    font-size:12px;letter-spacing:1px;color:#ffd166;font-weight:700;opacity:.9;
    text-shadow:0 2px 8px #000;pointer-events:none;display:none;white-space:nowrap}
  #patName.on{display:block}
</style>
</head>
<body>
<div id="wrap">
  <div id="frame">
    <canvas id="game" width="1280" height="720"></canvas>
    <div id="hud" class="layer">
      <div id="xpwrap"><div id="xpIn"></div></div>
      <div class="row">
        <span id="roundName">ROUND 1</span>
        <span id="roundSub"></span>
        <span id="whoNow">—</span>
        <span>LV <b id="lvNum">1</b></span>
        <div id="hpwrap"><div id="hpIn"></div><div class="lab" id="hpLab">100 / 100</div></div>
        <span id="livesHud" title="목숨">♥♥</span>
        <span id="timeBig">0:50</span>
        <button class="skip" id="skipBtn">스킵</button>
      </div>
      <div class="patbadge" id="patName"></div>
      <span id="kills" hidden></span><span id="dpsNow" hidden></span>
      <span id="score" hidden></span><span id="upNum" hidden></span>
    </div>
    <div id="toast"></div>
    <div id="stick"></div>
  </div>

  <div class="ov on" id="title">
    <div class="card">
      <div class="eyebrow">4라운드 · 매 라운드 보스 · 1등 오레오</div>
      <h1>플라스틱 배출량 기반 과세</h1>
      <h2>1라운드는 발표자 시범 · 직전 대비 DPS 1등이 오레오</h2>
      <div class="keys"><kbd>WASD</kbd> 이동 · 공격 자동 · 틀려도 강화 · 정답이면 더 좋은 강화</div>
      <div class="diffpick" id="diffPick"></div>
      <button class="btn" id="startBtn">시작</button>
    </div>
  </div>

  <div class="ov" id="upg">
    <div class="card" style="text-align:center">
      <div class="eyebrow op" id="upgWhy">LEVEL UP</div>
      <h1>강화 하나</h1>
      <div class="ucards" id="upgCards"></div>
    </div>
  </div>

  <div class="ov" id="turn">
    <div class="card" style="text-align:center">
      <div class="eyebrow" id="tnEyebrow">ROUND 1 / 4</div>
      <h1 id="tnName">해 볼 사람?</h1>
      <h2 id="tnDesc"></h2>
      <div class="pick">
        <input id="tnInput" placeholder="이름 (비워도 됨)" autocomplete="off" spellcheck="false" maxlength="12">
      </div>
      <button class="btn" id="tnBtn">시작</button>
    </div>
  </div>

  <div class="ov" id="quiz">
    <div class="card">
      <div class="eyebrow" id="qzEyebrow">퀴즈</div>
      <h1 id="qzQ"></h1>
      <h2 id="qzHint"></h2>
      <div class="opts" id="qzOpts"></div>
      <div class="verdict" id="qzVerdict"></div>
      <button class="btn" id="qzNext" style="display:none">계속</button>
    </div>
  </div>

  <div class="ov" id="clear">
    <div class="card" style="text-align:center">
      <div class="eyebrow">CLEAR</div>
      <h1 id="clTitle"></h1>
      <h2 id="clLine"></h2>
      <button class="btn" id="clBtn">다음</button>
    </div>
  </div>

  <div class="ov" id="death">
    <div class="card" style="text-align:center">
      <div class="eyebrow op" id="deathTitle">쓰러짐</div>
      <h1>재시도?</h1>
      <h2 id="deathDesc"></h2>
      <div class="deathbtns">
        <button class="btn gold" id="retryRoundBtn">재시도</button>
        <button class="btn ghost" id="skipDeathBtn">스킵</button>
      </div>
    </div>
  </div>

  <div class="ov" id="end">
    <div class="card">
      <div class="eyebrow">결과</div>
      <h1 id="endTitle">복습 완료</h1>
      <div class="scoreline" id="endStats"></div>
      <div id="endBody"></div>
      <button class="btn" id="retryBtn">틀린 문제만</button>
      <button class="btn ghost" id="againBtn">처음부터</button>
    </div>
  </div>
</div>

<script>
"use strict";
/* ==========================================================================
   플라스틱 배출량 기반 과세 — 복습 서바이버
   4라운드. 매 라운드 사냥 → 보스 → 퀴즈.
   1라운드 = 발표자 시범. 직전 대비 DPS 1등 = 오레오.
   퀴즈는 틀려도 강화, 정답이면 더 좋은 강화.
   ========================================================================== */
const QUIZ_BANK = {

/* ── 1. 플라스틱세란? ───────────────────────────────────────── */
q101:{ type:'mc',
  q:'플라스틱세는 무엇에 비례해 세금을 매기나요?',
  opts:['쓰거나 버린 양','기업의 영업이익','포장재의 색깔','재활용 공장 수'], answer:0,
  why:'발표 정의 그대로입니다. <b>플라스틱을 쓰거나 버린 양</b>에 비례합니다.' },

q102:{ type:'mc',
  q:'과세 시점을 나눈 두 가지는?',
  opts:['대기업 / 중소기업','국내 / 수입','업스트림 / 다운스트림','재활용 / 소각'], answer:2,
  why:'<b>만들 때(업스트림)</b> 매길지, <b>버릴 때(다운스트림)</b> 매길지입니다.' },

/* ── 2. 원리와 유인 설계 ────────────────────────────────────── */
q201:{ type:'mc',
  q:'플라스틱세가 구현하려는 원칙은?',
  opts:['수익자 부담','응능부담','예방 원칙','오염자 부담(Polluter Pays)'], answer:3,
  why:'<b>오염자 부담 원칙</b>입니다. 환경을 오염시킨 쪽이 치우는 비용을 냅니다.' },

q202:{ type:'opinion',
  q:'플라스틱세의 1차 목표, 어디에 두시겠어요?',
  opts:['사용량 줄이기','재원 마련','대체소재 유도','인식 개선'],
  reacts:[
    '사용량을 줄이려면 세율이 <b>충분히 높아야</b> 합니다.',
    '재원 확보를 노리면, 세수가 안 줄어든다는 건 <b>사용량이 안 줄었다</b>는 뜻이 됩니다.',
    '기술 유도라면 영국처럼 <b>재생원료 30%</b> 같은 기준선이 필요합니다.',
    '인식 개선이라면 소비자가 체감하는 <b>다운스트림</b>이 유리합니다.' ],
  close:'정답은 없습니다. 목표를 정해야 세율과 과세 단계가 따라옵니다.' },

/* ── 3. 업스트림 ① 영국 ─────────────────────────────────────── */
q301:{ type:'mc',
  q:'영국 PPT는 어떤 포장재에 세금을 매기나요?',
  opts:['재생원료 30% 미만인 포장재','모든 플라스틱 포장재','수입 포장재만','비닐봉지뿐'], answer:0,
  why:'영국 PPT는 <b>재생 플라스틱 함량 30% 미만</b> 포장재가 대상입니다. 30%를 넘기면 세금이 안 붙습니다.' },

q302:{ type:'mc',
  q:'영국 PPT는 누구에게 매기나요?',
  opts:['소비자','유통업체','생산자·수입자','지자체'], answer:2,
  why:'영국은 <b>생산자·수입자</b>에게 직접, <b>무게(톤)</b>으로 매깁니다.' },

/* ── 4. 업스트림 ② EU ───────────────────────────────────────── */
q401:{ type:'mc',
  q:'EU 플라스틱 분담금의 대상은?',
  opts:['만든 플라스틱 전부','수입 원료','일회용컵만','재활용되지 않은 포장 폐기물'], answer:3,
  why:'EU 분담금은 <b>재활용되지 않은 플라스틱 포장 폐기물</b>이 대상입니다. 만든 양이 아니라 못 살린 양입니다.' },

q402:{ type:'mc',
  q:'EU 분담금을 실제로 내는 주체는?',
  opts:['회원국 정부','개별 기업','소비자','WTO'], answer:0,
  why:'EU는 기업이 아니라 <b>회원국이 EU 예산에 분담금</b>을 냅니다. 1kg당 0.80유로입니다.' },

/* ── 5. 다운스트림 ① ────────────────────────────────────────── */
q501:{ type:'mc',
  q:'종량제 봉투가 다운스트림인 이유는?',
  opts:['생산자가 내기 때문','지자체가 만들기 때문','버리는 사람이 버리는 양만큼 내기 때문','수입품만 대상이기 때문'], answer:2,
  why:'종량제는 <b>버리는 사람이 버린 양(봉투 크기)만큼</b> 내는 다운스트림입니다.' },

q502:{ type:'opinion',
  q:'한국에 지금 더 필요한 쪽은?',
  opts:['업스트림(생산부터)','다운스트림(배출자가 체감)','둘 다','지금 유지'],
  reacts:[
    '업스트림은 대상이 적어 징수가 쉽습니다. 대신 소비자는 잘 못 느낍니다.',
    '다운스트림은 체감이 큽니다. 대신 <b>역진세</b> 논란이 따라옵니다.',
    '효과는 크지만 <b>이중 부담</b> 반발이 나옵니다.',
    '유지하려면 "왜 지금으로 충분한가"를 설명해야 합니다.' ],
  close:'한국은 다운스트림이 이미 발달해, 논점이 업스트림으로 옮겨 가는 중입니다.' },

/* ── 6. 다운스트림 ② ────────────────────────────────────────── */
q601:{ type:'mc',
  q:'발표에서 든 한국 다운스트림 사례가 <u>아닌</u> 것은?',
  opts:['생산자책임재활용(EPR)','종량제 봉투','자원순환보증금제','일회용컵 보증금제'], answer:0,
  why:'발표 사례는 <b>종량제 봉투 · 자원순환보증금제 · 일회용컵 보증금제</b>입니다. EPR은 생산자 쪽입니다.' },

q602:{ type:'mc',
  q:'보증금제가 세금과 다른 점은?',
  opts:['금액이 더 크다','정부가 안 걷는다','기업만 낸다','돌려주면 환급된다'], answer:3,
  why:'보증금은 <b>반환하면 돌려받습니다</b>. 잘 돌려주면 실질 부담이 0입니다.' },

/* ── 7. 설계 쟁점 ① ─────────────────────────────────────────── */

/* ── 교대 플레이 & 딜량 기록 ──
   차례(턴)마다 낸 피해와 실제 플레이 시간을 재서 초당 피해(DPS)를 냅니다.
   순위는 '직전 사람 대비 몇 % 더 냈는가' — 강화 차이가 한 단계뿐이라 비교적 공정합니다. */
const roster = [];
const turns = [];              /* 턴 기록 {name, dmg, sec, round} */
let curPlayer = null, curTurn = null, autoNo = 0;
const MIN_SEC = 5;             /* 이 시간보다 짧으면 성장률 순위에서 제외 */
function newPlayer(name){
  const p = {name, kills:0, deaths:0, correct:0, asked:0, rounds:0, dmg:0, sec:0};
  roster.push(p); return p;
}
function pickPlayer(raw){
  const name = (raw||'').trim().slice(0,12);
  curPlayer = (name && roster.find(p=>p.name===name)) || newPlayer(name || ('도전자 ' + (++autoNo)));
  dom('whoNow').textContent = curPlayer.name;
  curTurn = {name:curPlayer.name, dmg:0, sec:0, round: round ? round.n : 1};
  turns.push(curTurn);
  return curPlayer;
}
/* 실제로 몬스터 체력을 깎은 만큼만 딜로 인정 (오버킬 제외) */
function addDmg(n){
  if(!(n>0)) return;
  if(curTurn) curTurn.dmg += n;
  if(curPlayer) curPlayer.dmg += n;
}
const dps = t => t.sec >= 1 ? t.dmg / t.sec : 0;
/* 직전 턴 대비 성장률(%) — 첫 턴은 기준이라 null */
function growth(i){
  if(i<=0) return null;
  const a = turns[i], b = turns[i-1];
  if(a.sec < MIN_SEC || b.sec < MIN_SEC) return null;
  const pb = dps(b); if(pb<=0) return null;
  return (dps(a)-pb)/pb*100;
}

function handleKey(e){
  const c = e.code;
  if(state===S.death){
    if(c==='KeyR'||c==='Digit1'||c==='Numpad1'){ retryRound(); return; }
    if(c==='KeyN'||c==='Digit2'||c==='Numpad2'||c==='Enter'||c==='Space'){ skipFromDeath(); return; }
    return;
  }
  if(state===S.title){ if(c==='Enter'||c==='Space') startGame(); return; }
  if(state===S.upg){
    const n = {Digit1:0,Digit2:1,Digit3:2,Numpad1:0,Numpad2:1,Numpad3:2}[c];
    if(n!==undefined) takeUpgrade(n);
    return;
  }

    const n = {Digit1:0,Digit2:1,Digit3:2,Digit4:3,Numpad1:0,Numpad2:1,Numpad3:2,Numpad4:3}[c];
    if(n!==undefined) pickOpt(n);

    return;

  if(state===S.clear){ if(c==='Enter'||c==='Space') dom('clBtn').click(); return; }

  if(c==='KeyM'){ soundOn=!soundOn; toast(soundOn?'🔊 소리 켜짐':'🔇 소리 꺼짐'); }

let actx=null;
function beep(f,d=.08,t='square',v=.05){
  if(!soundOn) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain();
    o.type=t; o.frequency.value=f;
    g.gain.setValueAtTime(v,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+d);
    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime+d);
  }catch(_){}
}

const FOE_CAP = 240;

function makeFoe(type, x, y){
  if(ents.foes.length >= FOE_CAP) return;
  const d = ENEMY[type];
  if(!d) return;
  ents.foes.push({t:type, x, y, r:d.r, hp:Math.round(d.hp*D().ehp), maxHp:Math.round(d.hp*D().ehp),
                  flash:0, cool:.8+Math.random()*1.8, ph:Math.random()*6, slowT:0,
                  kx:0, ky:0, born: d.swarm ? .08 : .22});
}
function spawnAt(type, distMin, distMax, instant){
  const d = ENEMY[type];
  if(!d) return;
  const a = Math.random()*Math.PI*2;
  const dist = distMin + Math.random()*(distMax-distMin);
  let x = player.x + Math.cos(a)*dist, y = player.y + Math.sin(a)*dist;
  x = Math.max(40, Math.min(AW-40, x)); y = Math.max(40, Math.min(AH-40, y));
  if(instant || d.swarm){ makeFoe(type, x, y); return; }
  marks.push({x, y, life:1, r:d.r});
  pending.push({type, x, y, t:.22});
}
function spawnFoe(type, instant){
  const d = ENEMY[type];
  if(!d) return;
  if(d.swarm) spawnAt(type, 180, 460, true);
  else spawnAt(type, 420, 760, instant);
}
function spawnSwarm(type, n){
  const a = Math.random()*Math.PI*2;
  const dist = 240 + Math.random()*220;
  let cx = player.x + Math.cos(a)*dist, cy = player.y + Math.sin(a)*dist;
  cx = Math.max(80, Math.min(AW-80, cx));
  cy = Math.max(80, Math.min(AH-80, cy));
  const count = n || 10;
  for(let i=0;i<count && ents.foes.length<FOE_CAP;i++){
    const j = Math.random()*Math.PI*2, r = 16+Math.random()*110;
    makeFoe(type, cx+Math.cos(j)*r, cy+Math.sin(j)*r);
  }
}
function seedHunt(){
  if(!round) return;
  const pool = round.pool || ['bag','cup'];
  const fodder = pool.filter(t=>ENEMY[t] && ENEMY[t].swarm);
  const pack = fodder.length ? fodder : ['straw'];
  for(let i=0;i<5;i++) spawnSwarm(pack[i%pack.length], 14+Math.floor(Math.random()*10));
  for(let i=0;i<22 && ents.foes.length<FOE_CAP;i++){
    spawnFoe(pool[Math.floor(Math.random()*pool.length)], true);

function tickPat(id, B, dt){
  const box = BOX, p = player;

          const a = base + (i-(n-1)/2)*.105;
          shotOrb(ox, oy, Math.cos(a)*270, Math.sin(a)*270);
        }
      }
      break;
    }
    case 'spiral': {
      B.spin += dt * (rage?7.4:5.4);

        const a = B.spin, sp = 175;
        shotOrb(cx, cy, Math.cos(a)*sp, Math.sin(a)*sp, {col:'#c77dff', r:6.5});
        shotOrb(cx, cy, Math.cos(a+Math.PI)*sp, Math.sin(a+Math.PI)*sp, {col:'#c77dff', r:6.5});
      }
      break;
    }
    case 'ring': {
      B.acc += dt;
      if(B.acc > 1.05*mul){
        B.acc = 0;
        const ox = box.x+box.w/2, oy = box.y+box.h/2;
        const n = rage?20:14;
        for(let i=0;i<n;i++){
          const a = i/n*Math.PI*2 + B.ph;
          shotOrb(ox, oy, Math.cos(a)*200, Math.sin(a)*200);
        }
      }
      break;
    }
    case 'rain': {
      B.acc += dt;
      if(B.acc > (rage?.11:.16)){
        B.acc = 0;
        const x = box.x+18+Math.random()*(box.w-36);
        shotOrb(x, box.y-10, (Math.random()-.5)*36, 210+Math.random()*55, {col:'#7aa2ff', r:6});
      }
      break;
    }
    case 'bonesH': {
      B.acc += dt;
      if(B.acc > 1.28*mul){
        B.acc = 0;
        const gap = rage?58:74;
        const gy = box.y+28+Math.random()*(box.h-56-gap);

        for(let y=box.y+12; y<box.y+box.h-12; y+=19){
          if(y>gy && y<gy+gap) continue;
          shotBone(x0, y, vx, 0, 24, 15);
        }
      }
      break;
    }
    case 'bonesV': {
      B.acc += dt;
      if(B.acc > 1.32*mul){
        B.acc = 0;

        const gx = box.x+30+Math.random()*(box.w-60-gap);
        for(let x=box.x+12; x<box.x+box.w-12; x+=19){
          if(x>gx && x<gx+gap) continue;

    }
    case 'plus': {

      }
      break;
    }
    case 'sweep': {
      B.acc += dt;
      if(B.acc > 1.85*mul){

        }
      }
      break;
    }
    case 'shrink': {
      BOX.w = Math.max(DIFF===2?250:280, BOX.w - dt*22);
      BOX.h = Math.max(DIFF===2?180:210, BOX.h - dt*14);
      BOX.x = AW/2 - BOX.w/2;
      player.x = Math.max(BOX.x+player.r, Math.min(BOX.x+BOX.w-player.r, player.x));
      player.y = Math.max(BOX.y+player.r, Math.min(BOX.y+BOX.h-player.r, player.y));
      B.acc += dt;
      if(B.acc > (rage?.14:.2)){
        B.acc = 0;
        const x = box.x+16+Math.random()*(box.w-32);
        shotOrb(x, box.y-8, 0, 195, {col:'#3ddc97', r:6});
      }
      break;
    }
    case 'spiralRain': {
      B.spin += dt * (rage?6.6:4.8);
      if(Math.random() < dt*(rage?14:9)){
        const cx = box.x+box.w/2, cy = box.y+box.h/2;
        const a = B.spin;
        shotOrb(cx, cy, Math.cos(a)*160, Math.sin(a)*160, {r:6, col:'#c77dff'});
      }
      if(Math.random() < dt*(rage?8:5)){
        const x = box.x+16+Math.random()*(box.w-32);
        shotOrb(x, box.y-8, 0, 175, {r:5.5, col:'#7aa2ff'});
      }
      break;
    }
  }
}
function hitShot(s, p){
  if(s.kind==='laser' || s.kind==='sweep'){
    if(s.warnT>0 || !s.active) return false;
    return Math.abs(p.x-s.x) < s.w/2+p.r && Math.abs(p.y-s.y) < s.h/2+p.r;
  }
  if(s.kind==='bone'){
    return Math.abs(p.x-s.x) < s.w/2+p.r && Math.abs(p.y-s.y) < s.h/2+p.r;
  }
  const r = (s.r||7)+p.r;
  return (s.x-p.x)**2 + (s.y-p.y)**2 < r*r;
}

/* ── 물리/전투 ── */
const dist2 = (a,b)=> (a.x-b.x)**2 + (a.y-b.y)**2;

function updateFx(dt){
  time += dt;
  if(shake>0) shake = Math.max(0, shake-dt*3);
  if(flashA>0) flashA = Math.max(0, flashA-dt*3);
  if(slowmo>0) slowmo = Math.max(0, slowmo-dt);
  if(comboT>0){ comboT -= dt; if(comboT<=0) combo = 0; }
  for(const r of rings){ r.r += (r.max-r.r)*Math.min(1,dt*9); r.life -= dt*2.2; }
  for(let i=rings.length-1;i>=0;i--) if(rings[i].life<=0) rings.splice(i,1);
  for(const n of dmgNums){ n.y -= dt*46; n.life -= dt*1.5; }
  for(let i=dmgNums.length-1;i>=0;i--) if(dmgNums[i].life<=0) dmgNums.splice(i,1);
  for(const m of marks) m.life -= dt*2.4;
  for(let i=marks.length-1;i>=0;i--) if(marks[i].life<=0) marks.splice(i,1);
  for(const q of ents.parts){ q.x+=q.vx*dt; q.y+=q.vy*dt; q.life-=dt; q.vx*=.94; q.vy*=.94; }
  ents.parts = ents.parts.filter(q=>q.life>0);
}

function update(dtRaw){
  if(state!==S.play){ updateFx(dtRaw); return; }
  if(hitStop>0){ hitStop -= dtRaw; updateFx(dtRaw); return; }
  const dt = dtRaw * (slowmo>0 ? .35 : 1);
  updateFx(dt);
  if(curTurn){ curTurn.sec += dtRaw; if(curPlayer) curPlayer.sec += dtRaw; }
  const p = player;

  /* 이동 */
  let ix = (keys.ArrowRight||keys.KeyD?1:0) - (keys.ArrowLeft||keys.KeyA?1:0);
  let iy = (keys.ArrowDown||keys.KeyS?1:0) - (keys.ArrowUp||keys.KeyW?1:0);
  if(stick.dx||stick.dy){ ix = stick.dx; iy = stick.dy; }
  const m = Math.hypot(ix,iy);
  if(m>1){ ix/=m; iy/=m; }
  if(p.slowT>0) p.slowT -= dt;
  const spd = ST.move() * (p.slowT>0 ? .55 : 1);
  p.x += ix*spd*dt; p.y += iy*spd*dt;
  if(inBoss()){
    p.x = Math.max(BOX.x+p.r, Math.min(BOX.x+BOX.w-p.r, p.x));
    p.y = Math.max(BOX.y+p.r, Math.min(BOX.y+BOX.h-p.r, p.y));
  } else {
    p.x = Math.max(p.r, Math.min(AW-p.r, p.x));
    p.y = Math.max(p.r, Math.min(AH-p.r, p.y));
  }
  if(ix) p.face = ix>0?1:-1;
  if(m>0.05) p.walk += dt*10;

  if(p.inv>0) p.inv -= dt;
  if(uv('regen')){ p.regen += dt;
    if(p.regen>=4){ p.regen=0; if(p.hp<p.maxHp){ p.hp=Math.min(p.maxHp,p.hp+2*uv('regen')); pop(p.x,p.y-18,3,'#3ddc97'); } } }

  /* 자동 조준 사격 */
  p.cool -= dt;
  if(p.cool<=0){
    const tgt = nearestFoe(ST.range());
    if(tgt){
      p.cool = ST.cool();
      const base = Math.atan2(tgt.y-p.y, tgt.x-p.x);
      const n = ST.n();
      for(let k=0;k<n;k++){
        const a = base + (n>1 ? (k-(n-1)/2)*ST.spread() : 0);
        ents.bullets.push({x:p.x, y:p.y, vx:Math.cos(a)*ST.bspeed(), vy:Math.sin(a)*ST.bspeed(),
                           life:ST.range()/ST.bspeed(), dmg:ST.dmg(), pierce:ST.pierce(), hit:[]});
      }
      p.muzzle = .07; p.mAng = base;
      p.recoil = 5;
      sfx.shot();
    }
  }
  if(p.muzzle>0) p.muzzle -= dt;
  if(p.recoil>0) p.recoil = Math.max(0, p.recoil - dt*36);

  /* 총알 */
  for(const b of ents.bullets){ b.x+=b.vx*dt; b.y+=b.vy*dt; b.life-=dt; }
  ents.bullets = ents.bullets.filter(b=>b.life>0);

  /* 라운드 타이머 — 사냥 구간이 끝나면 보스 */
  if(round && phase==='survive'){
    roundLeft -= dt;
    if(!bossWarn && roundLeft<=8){ bossWarn=true; toast('곧 보스'); }
    if(roundLeft<=0){ beginBoss(); return; }
  }

  /* 스폰 — 사냥 구간만. 한 번에 떼로 쏟아붓습니다 */
  if(round && phase==='survive'){
    spawnT -= dt;
    const elapsed = round.sec - roundLeft;
    const ramp = 1 + Math.min(1.4, elapsed/round.sec * 1.5);
    if(spawnT<=0 && ents.foes.length < FOE_CAP){
      spawnT = spawnGap / ramp;
      const pool = round.pool || ['bag','cup'];
      const burst = 8 + (DIFF>=1?4:2) + (roundIdx>=2?5:0) + (DIFF===2?6:0) + Math.floor(elapsed/6);
      for(let i=0;i<burst && ents.foes.length<FOE_CAP;i++){
        const t = pool[Math.floor(Math.random()*pool.length)];
        if(ENEMY[t] && ENEMY[t].swarm && Math.random()<.62) spawnSwarm(t, 10+Math.floor(Math.random()*12));
        else spawnFoe(t);
      }
    }
  }

  /* 정화 파동 — 보스전에선 상자 안에서 숨 고르기 */
  p.nova -= dt;
  if(p.nova<=0 && phase==='survive'){
    p.nova = ST.novaCD();
    const nR = ST.novaR(), nD = ST.novaD();
    ring(p.x, p.y, nR, '#c77dff', 7);
    ring(p.x, p.y, nR*.55, '#8ef0c4', 3);
    beep(280,.09,'sawtooth',.035);
    for(const f of ents.foes){
      if(f.hp<=0) continue;
      if((f.x-p.x)**2+(f.y-p.y)**2 < (nR+f.r)**2){
        addDmg(Math.min(nD, f.hp)); f.hp -= nD; f.flash=.12;
        const dx=f.x-p.x, dy=f.y-p.y, dd=Math.hypot(dx,dy)||1;
        f.kx += dx/dd*220; f.ky += dy/dd*220;
        if(f.hp<=0) killFoe(f);
      }
    }
  }

  /* 오라 / 위성 */
  const aR = ST.auraR();
  const orbN = ST.orbitN();
  const orbs = [];
  for(let i=0;i<orbN;i++){
    const a = time*2.1 + i*Math.PI*2/orbN;
    orbs.push({x:p.x+Math.cos(a)*86, y:p.y+Math.sin(a)*86});
  }

  /* 몬스터 */
  for(const f of ents.foes){
    if(f.hp<=0 || f.dead) continue;
    if(f.flash>0) f.flash -= dt;
    if(f.slowT>0) f.slowT -= dt;
    if(f.born>0) f.born -= dt;
    if(f.kx||f.ky){ f.x += f.kx*dt; f.y += f.ky*dt; f.kx*=.86; f.ky*=.86;
      if(Math.abs(f.kx)<3) f.kx=0; if(Math.abs(f.ky)<3) f.ky=0; }
    const d = ENEMY[f.t];
    const dx = p.x-f.x, dy = p.y-f.y, dd = Math.hypot(dx,dy)||1;
    let sp = d.spd * D().espd * (f.slowT>0 ? .5 : 1);
    if(f.t==='bottle'){
      /* 드론은 거리를 두고 캡을 쏩니다 */
      const want = 300;
      const dir = dd > want+40 ? 1 : dd < want-40 ? -1 : 0;
      f.x += dx/dd*sp*dir*dt; f.y += dy/dd*sp*dir*dt;
      f.cool -= dt;
      if(f.cool<=0 && dd<560){
        f.cool = d.shoot;
        ents.shots.push({x:f.x, y:f.y, vx:dx/dd*285, vy:dy/dd*285, life:3, dmg:d.dmg*.7, col:'#7ad7ff'});
        beep(700,.05,'square',.02);
      }
    } else if(f.t==='smog' || f.t==='bead' || f.t==='pellet'){
      f.ph += dt*3;
      const wob = Math.sin(f.ph)*.5;
      const a = Math.atan2(dy,dx)+wob;
      f.x += Math.cos(a)*sp*dt; f.y += Math.sin(a)*sp*dt;
    } else if(f.t==='tape' || f.t==='straw'){
      f.ph += dt*5;
      const a = Math.atan2(dy,dx)+Math.sin(f.ph)*.65;
      f.x += Math.cos(a)*sp*dt; f.y += Math.sin(a)*sp*dt;
    } else {
      f.x += dx/dd*sp*dt; f.y += dy/dd*sp*dt;
    }

    /* 총알 피격 — 크리티컬 / 데미지 숫자 / 넉백 / 스플래시 */
    for(let k=ents.bullets.length-1;k>=0;k--){
      const b = ents.bullets[k];
      if(b.hit.includes(f)) continue;
      if((b.x-f.x)**2 + (b.y-f.y)**2 < (f.r+7)**2){
        const crit = Math.random() < .16;
        const dm = b.dmg * (crit?2:1);
        addDmg(Math.min(dm, f.hp));
        f.hp -= dm; f.flash = crit?.2:.12;
        if(!d.swarm || crit) dnum(f.x, f.y-f.r-4, dm, crit);
        if(!d.swarm || Math.random()<.2) pop(b.x, b.y, crit?9:4, crit?'#ffd166':'#9be7ff');
        const bl = Math.hypot(b.vx,b.vy)||1;
        f.kx += b.vx/bl*(crit?230:130); f.ky += b.vy/bl*(crit?230:130);
        if(crit){ ring(f.x,f.y,44,'#ffd166',3); hitStop = Math.max(hitStop,.045); beep(1500,.05,'square',.03); }
        const sR = ST.splash(), sD = dm*.5;
        if(!d.swarm) ring(f.x, f.y, sR, '#9be7ff', 2);
        for(const o of ents.foes){
          if(o===f || o.hp<=0) continue;
          if((o.x-f.x)**2+(o.y-f.y)**2 < (sR+o.r)**2){
            addDmg(Math.min(sD, o.hp)); o.hp -= sD; o.flash=.08;
            if(o.hp<=0) killFoe(o);
          }
        }
        if(b.pierce>0){ b.pierce--; b.hit.push(f); } else ents.bullets.splice(k,1);
        if(f.hp<=0){ killFoe(f); break; }
      }
    }
    if(f.hp<=0) continue;

    /* 오라 / 위성 피해 */
    if(aR && dist2(p,f) < (aR+f.r)**2){
      const a2 = ST.auraD()*dt; addDmg(Math.min(a2, f.hp)); f.hp -= a2;
      if(f.hp<=0){ killFoe(f); continue; }
    }
    for(const o of orbs){
      if((o.x-f.x)**2 + (o.y-f.y)**2 < (f.r+18)**2){
        const o2 = ST.orbitD()*dt; addDmg(Math.min(o2, f.hp)); f.hp -= o2; f.flash=.08;
        if(f.hp<=0){ killFoe(f); break; }
      }
    }
    if(f.hp<=0) continue;

    /* 접촉 피해 */
    if(dist2(p,f) < (p.r+f.r)**2){
      hurt(d.dmg);
      if(d.slow){ p.slowT = 2.2; toast('🕸 그물에 걸렸습니다 — 잠시 느려집니다'); }
      const push = 1;
      f.x -= dx/dd*push*24; f.y -= dy/dd*push*24;
    }
  }
  ents.foes = ents.foes.filter(f=>f.hp>0);

  /* 보스 — 언더테일식 패턴 */
  if(ents.boss){
    const B = ents.boss, d = ENEMY.boss;
    if(B.flash>0) B.flash -= dt;
    B.ph += dt;
    B.x = AW/2; B.y = BOX.y - 88;
    if(B.intro>0){ B.intro -= dt; }
    else {
      const step = B.def.seq[B.seqI];
      B.patAge += dt;
      tickPat(step.id, B, dt);
      const pn = dom('patName');
      if(pn){ pn.textContent = 'PATTERN · ' + step.name + (B.hp<B.maxHp*.48?'  ★ RAGE':''); pn.classList.add('on'); }
      if(B.patAge >= step.dur * (B.hp<B.maxHp*.48 ? .82 : 1)) nextPat(B);
    }
    for(let k=ents.bullets.length-1;k>=0;k--){
      const b = ents.bullets[k];
      if(b.hit.includes(B)) continue;
      if((b.x-B.x)**2 + (b.y-B.y)**2 < (B.r+7)**2){
        addDmg(Math.min(b.dmg, B.hp)); dnum(B.x, B.y-B.r-6, b.dmg, false);
        B.hp -= b.dmg; B.flash=.12; pop(b.x,b.y,4,'#ffd166');
        if(b.pierce>0){ b.pierce--; b.hit.push(B); } else ents.bullets.splice(k,1);
        if(B.hp<=0){
          score += d.score; killsTotal++;
          shake=2; flashA=.7; slowmo=1.1; hitStop=.16;
          ring(B.x,B.y,520,'#ffd166',10); ring(B.x,B.y,320,'#ff6b6b',7);
          for(let i=0;i<70;i++) pop(B.x,B.y,1,['#ffd166','#ff6b6b','#4cc9f0'][i%3]);
          for(let t2=1;t2<=4;t2++) setTimeout(()=>{ ring(B.x,B.y,180+t2*90,'#fff2c9',5); beep(160/t2,.2,'sawtooth',.05); }, t2*130);
          const cx = B.x, cy = BOX.y + 44;
          ents.boss=null; ents.shots.length=0;
          const pn = dom('patName'); if(pn) pn.classList.remove('on');
          dropBossChest(cx, cy);
          toast('🎁 보물상자가 떨어졌다!');
          return;
        }
      }
    }
    if(aR && dist2(p,B) < (aR+B.r)**2){ const a3=ST.auraD()*dt; addDmg(Math.min(a3,B.hp)); B.hp -= a3; }
    for(const o of orbs) if((o.x-B.x)**2+(o.y-B.y)**2 < (B.r+18)**2){ const o3=ST.orbitD()*dt; addDmg(Math.min(o3,B.hp)); B.hp -= o3; }
  } else {
    const pn = dom('patName'); if(pn) pn.classList.remove('on');
  }

  /* 적 투사체 · 탄막 */
  for(const s of ents.shots){
    if(s.warnT>0){ s.warnT -= dt; if(s.warnT<=0) s.active = true; }
    if(s.homing){
      const dx=p.x-s.x, dy=p.y-s.y, dd=Math.hypot(dx,dy)||1;
      s.vx += dx/dd*s.homing*90*dt; s.vy += dy/dd*s.homing*90*dt;
      const sp=Math.hypot(s.vx,s.vy)||1, max=150;
      if(sp>max){ s.vx=s.vx/sp*max; s.vy=s.vy/sp*max; }
    }
    if(!s.warnT || s.kind==='sweep' && s.active){ s.x+=s.vx*dt; s.y+=s.vy*dt; }
    s.life-=dt;
  }
  ents.shots = ents.shots.filter(s=>{
    if(s.life<=0) return false;
    if(hitShot(s,p)){ hurt(s.dmg); return s.kind==='laser'||s.kind==='sweep'; }
    return true;
  });

  /* 경험치 조각 — 수명 게이지, 자석, 전량 흡수 */
  const mag = ST.magnet();
  for(const g of ents.gems){
    g.ph += dt*4;
    if(g.wait>0){ g.wait -= dt; if(g.wait<=0){ g.vac=true; g.pull=true; } }
    if(g.life!=null){
      if(!g.vac) g.life -= dt;
      if(g.life<=0){
        pop(g.x,g.y,6, g.item ? ITEMS[g.item].col : GEMS[g.tier].col);
        g.dead = true; continue;
      }
    }
    if(g.vx||g.vy){ g.x += g.vx*dt; g.y += g.vy*dt; g.vx*=.9; g.vy*=.9;
      if(Math.abs(g.vx)<6) g.vx=0; if(Math.abs(g.vy)<6) g.vy=0; }
    const dx=p.x-g.x, dy=p.y-g.y, dd=Math.hypot(dx,dy)||1;
    if(g.vac){
      const s2 = 980;
      g.x += dx/dd*s2*dt; g.y += dy/dd*s2*dt;
      const col = g.item ? ITEMS[g.item].col : GEMS[g.tier].col;
      if(ents.parts.length<180) ents.parts.push({x:g.x, y:g.y, vx:0, vy:0, life:.18, col, r:2.5});
    } else if(g.pull || dd < mag){
      g.pull = true;
      const s2 = 300 + (mag-dd)*3.4;
      g.x += dx/dd*s2*dt; g.y += dy/dd*s2*dt;
      if(ents.parts.length<180 && Math.random()<.35) ents.parts.push({x:g.x, y:g.y, vx:0, vy:0, life:.22,
        col: g.item ? ITEMS[g.item].col : GEMS[g.tier].col, r:2.5});
    }
  }
  ents.gems = ents.gems.filter(g=>{
    if(g.dead) return false;
    const reach = g.item==='chest' ? (p.r+42) : (p.r+14);
    if(dist2(p,g) < reach*reach){ collect(g); return false; }
    return true;
  });

  /* 예고 후 실제 스폰 */
  for(const s2 of pending) s2.t -= dt;
  for(let i=pending.length-1;i>=0;i--){
    if(pending[i].t<=0){ const q=pending[i]; makeFoe(q.type,q.x,q.y); pending.splice(i,1); }
  }

  /* 카메라 — 보스전은 상자를 고정으로 보여 줍니다 */
  if(inBoss()){
    const tx = BOX.x + BOX.w/2 - W/2;
    const ty = BOX.y + BOX.h/2 - H/2 - 70;
    cam.x += (tx-cam.x)*Math.min(1,dt*8);
    cam.y += (ty-cam.y)*Math.min(1,dt*8);
  } else {
    const tx = Math.max(0, Math.min(AW-W, p.x-W/2));
    const ty = Math.max(0, Math.min(AH-H, p.y-H/2));
    cam.x += (tx-cam.x)*Math.min(1,dt*8);
    cam.y += (ty-cam.y)*Math.min(1,dt*8);
  }

  updateHud();
}

function nearestFoe(range){
  let best=null, bd=range*range;
  for(const f of ents.foes){ const d=dist2(player,f); if(d<bd){ bd=d; best=f; } }
  if(ents.boss){ const d=dist2(player,ents.boss); if(d<bd){ bd=d; best=ents.boss; } }
  return best;
}
function killFoe(f){
  if(!f || f.dead) return;
  const d = ENEMY[f.t];
  f.dead = true; f.hp = 0; killsTotal++;
  combo++; comboT = 2.2;
  score += Math.round(d.score * (1 + Math.min(combo,30)*.04));
  if(curPlayer) curPlayer.kills++;
  const swarm = !!d.swarm;
  if(!swarm){
    hitStop = Math.max(hitStop, d.r>22 ? .06 : .03);
    shake = Math.max(shake, d.r>22 ? .6 : .3);
    ring(f.x, f.y, 26+d.r*1.8, '#cfe8ff', 3);
    pop(f.x, f.y, 14, '#cfe8ff');
    pop(f.x, f.y, 8, '#4cc9f0');
    beep(220 + Math.random()*90, .07, 'sawtooth', .04);
  } else if(Math.random()<.14){
    pop(f.x, f.y, 3, '#cfe8ff');
  }
  dropGem(f, d);
  if(uv('vamp') && !swarm) player.hp = Math.min(player.maxHp, player.hp + 1*uv('vamp'));
  if(killFoe._depth < 3){
    killFoe._depth++;
    const R = ST.boomR(), bd = ST.boomD();
    if(!swarm || killFoe._depth===1) ring(f.x, f.y, R, '#ffd166', swarm?2:5);
    for(const o of ents.foes){
      if(o===f || o.hp<=0 || o.dead) continue;
      if((o.x-f.x)**2+(o.y-f.y)**2 < R*R){
        addDmg(Math.min(bd,o.hp)); o.hp -= bd; o.flash=.1;
        if(o.hp<=0) killFoe(o);
      }
    }

function dropGem(f, d){

  if(gemN >= GEM_CAP) return;

  }
  const g = GEMS[tier];
  const lifeMul = [1, 1.08, 1.18, 1.35][tier];
  const maxL = D().gemLife * lifeMul * (d.xp===0 ? .7 : 1);
  ents.gems.push({x:f.x, y:f.y, tier, v:g.v, ph:Math.random()*6,

  if(d.xp===0) return;

  else if(ir < D().drop+.022) dropI('magnet', -16, 0, 12);

}
function hurt(n){

function collect(g){

      p.hp = Math.min(p.maxHp, p.hp + 8);

      let n = 0;

        if((f.x-p.x)**2+(f.y-p.y)**2 < R*R){

          addDmg(Math.min(dm, f.hp)); f.hp -= dm; f.flash=.15;
          f.kx += (f.x-p.x)*1.4; f.ky += (f.y-p.y)*1.4;

  pop(g.x, g.y, 3 + g.tier*3, gd.col);

}

let upgChoices=[], upgDone=null, upgQueue=0, upgWhy='';
function queueUpgrades(n, why){
  upgQueue += n; upgWhy = why || '강화 획득';
  if(state===S.play || afterChestFinish) runUpgradeQueue(()=>{
    if(afterChestFinish){ afterChestFinish=false; finishRound(false); return; }
    state = S.play;
  });
}
function runUpgradeQueue(done){
  if(upgQueue<=0){ done && done(); return; }
  upgQueue--;
  showUpgrade(()=>runUpgradeQueue(done));
}
function rollUpgrades(){
  const pool = UPGRADES.filter(u=> uv(u.id) < u.max);
  const byCat = {};
  pool.forEach(u=>{ (byCat[u.cat]=byCat[u.cat]||[]).push(u); });
  const cats = Object.keys(byCat).sort(()=>Math.random()-.5);
  const out = [];
  for(const c of cats){ if(out.length>=3) break;
    const arr = byCat[c]; out.push(arr[Math.floor(Math.random()*arr.length)]); }
  const rest = pool.filter(u=>!out.includes(u)).sort(()=>Math.random()-.5);
  while(out.length<3 && rest.length) out.push(rest.shift());
  return out.sort(()=>Math.random()-.5).slice(0,3);
}
function showUpgrade(done){
  upgDone = done;
  upgChoices = rollUpgrades();
  if(!upgChoices.length){ upgDone=null; done&&done(); return; }
  state = S.upg;

  dom('upgCards').innerHTML = upgChoices.map((u,i)=>{

  }).join('');

function shuffleArr(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    const t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function dealQuiz(src){
  const n = src.opts.length;
  const order = shuffleArr(Array.from({length:n}, (_,i)=>i));
  const q = Object.assign({}, src);
  q.opts = order.map(i=>src.opts[i]);
  if(src.reacts) q.reacts = order.map(i=>src.reacts[i]);
  if(typeof src.answer==='number') q.answer = order.indexOf(src.answer);
  q._order = order;
  return q;
}

function pickOpt(i){

    html += `<h2 style="margin-top:16px">강화</h2>
      <div class="uplist">` +
      ups.map(u=>`<span>${u.icon} ${u.name}${uv(u.id)>1?' ×'+uv(u.id):''}</span>`).join('') + `</div>`;
  }
  if(roster.length){
    const rank = roster.slice().sort((a,b)=> (b.dmg-a.dmg)||(b.kills-a.kills));
    html += `<h2 style="margin-top:16px">플레이어</h2>
      <table class="ptable"><thead><tr><th>이름</th><th>누적 딜량</th><th>플레이</th><th>평균 DPS</th><th>처치</th><th>쓰러짐</th><th>퀴즈</th></tr></thead><tbody>` +
      rank.map((pl,i)=>`<tr><td>${i===0&&pl.dmg?'🏆 ':''}${pl.name}</td>
        <td>${Math.round(pl.dmg).toLocaleString()}</td><td>${pl.sec.toFixed(0)}초</td>
        <td>${pl.sec>=1?Math.round(pl.dmg/pl.sec):0}</td>
        <td>${pl.kills}</td><td>${pl.deaths}</td><td>${pl.correct}/${pl.asked}</td></tr>`).join('') +
      `</tbody></table>`;
  }
  const wrong = mc.filter(r=>!r.ok);
  const ops = results.filter(r=>r.opinion);
  if(wrong.length===0){
    html += `<h2 style="margin-top:16px">오답 없음</h2>`;
    dom('retryBtn').style.display='none';
  }else{
    dom('retryBtn').style.display='inline-block';
    html += `<h2 style="margin-top:16px">오답 ${wrong.length}</h2><ul class="review">` +
      wrong.map(r=>{ const q=QUIZ_BANK[r.id];
        return `<li><div class="q">${q.q}</div><div class="a">정답 — ${q.opts[q.answer]}</div>
                <div class="m">${q.why}</div></li>`; }).join('') + '</ul>';
  }
  if(ops.length){
    html += `<h2 style="margin-top:16px">의견</h2><ul class="review">` +
      ops.map(r=>{ const q=QUIZ_BANK[r.id];
        return `<li><div class="q">${q.q}</div><div class="pick2">→ ${q.opts[r.picked]}</div>
                <div class="m">${q.reacts[r.picked]}</div></li>`; }).join('') + '</ul>';
  }
  dom('endBody').innerHTML = html;
  dom('end').classList.add('on');
}
dom('retryBtn').onclick = ()=>{
  const wrong = results.filter(r=>!r.ok && !r.opinion).map(r=>r.id);
  if(!wrong.length) return;
  reviewMode = true; dom('end').classList.remove('on');
  openQuiz(wrong, '오답');
};

/* ── 렌더 ── */
function render(){
  const th = round ? round.theme : ROUNDS[0].theme;
  ctx.save();
  if(shake>0) ctx.translate((Math.random()-.5)*10*shake,(Math.random()-.5)*10*shake);

  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,th.a); g.addColorStop(1,th.b);
  ctx.fillStyle=g; ctx.fillRect(-20,-20,W+40,H+40);
  if(!round){ ctx.restore(); return; }

  ctx.translate(-Math.round(cam.x), -Math.round(cam.y));

  /* 바닥 격자 */
  ctx.strokeStyle='rgba(255,255,255,.045)'; ctx.lineWidth=1;
  const gs=80;
  const x0=Math.floor(cam.x/gs)*gs, y0=Math.floor(cam.y/gs)*gs;
  ctx.beginPath();
  for(let x=x0;x<cam.x+W+gs;x+=gs){ ctx.moveTo(x,cam.y-gs); ctx.lineTo(x,cam.y+H+gs); }
  for(let y=y0;y<cam.y+H+gs;y+=gs){ ctx.moveTo(cam.x-gs,y); ctx.lineTo(cam.x+W+gs,y); }
  ctx.stroke();
  /* 아레나 경계 */
  ctx.strokeStyle=th.acc; ctx.globalAlpha=.5; ctx.lineWidth=4;
  ctx.strokeRect(0,0,AW,AH); ctx.globalAlpha=1;

  /* 보스전 탄막 상자 */
  if(inBoss()){
    ctx.save();
    ctx.fillStyle='rgba(4,8,18,.5)';
    ctx.fillRect(cam.x-40, cam.y-40, W+80, H+80);
    ctx.fillStyle='rgba(12,22,44,.4)';
    ctx.fillRect(BOX.x, BOX.y, BOX.w, BOX.h);
    ctx.strokeStyle='#eaf2ff';
    ctx.globalAlpha = .8 + Math.sin(time*7)*.12;
    ctx.lineWidth=5;
    ctx.strokeRect(BOX.x, BOX.y, BOX.w, BOX.h);
    ctx.strokeStyle=th.acc; ctx.globalAlpha=.55; ctx.lineWidth=2;
    ctx.strokeRect(BOX.x+6, BOX.y+6, BOX.w-12, BOX.h-12);
    ctx.restore();
  }

  /* 정화 오라 */
  const aR = ST.auraR();
  if(aR){
    const ag = ctx.createRadialGradient(player.x,player.y,aR*.3,player.x,player.y,aR);
    ag.addColorStop(0,'rgba(61,220,151,.16)'); ag.addColorStop(1,'rgba(61,220,151,0)');
    ctx.fillStyle=ag; ctx.beginPath(); ctx.arc(player.x,player.y,aR,0,7); ctx.fill();
    ctx.strokeStyle='rgba(61,220,151,.35)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(player.x,player.y,aR,0,7); ctx.stroke();
  }

  /* 스폰 예고 */
  for(const m of marks){
    if(!inView(m.x,m.y,60)) continue;
    ctx.save(); ctx.translate(m.x,m.y);
    ctx.globalAlpha = .25 + Math.abs(Math.sin(time*18))*.4;
    ctx.strokeStyle='#ff8fa3'; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.arc(0,0,m.r+10*(1-m.life)+6,0,7); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-9,0); ctx.lineTo(9,0); ctx.moveTo(0,-9); ctx.lineTo(0,9); ctx.stroke();
    ctx.globalAlpha=1; ctx.restore();
  }

  /* 경험치 조각 · 아이템 */
  for(const gm of ents.gems){
    if(!inView(gm.x,gm.y, gm.item==='chest'?90:40)) continue;
    ctx.save(); ctx.translate(gm.x, gm.y+Math.sin(gm.ph)*2.5);
    if(gm.item==='chest'){
      const pulse = 1.15 + Math.sin(time*8)*.12;
      ctx.scale(pulse,pulse);
      ctx.globalAlpha=.35; ctx.fillStyle='#ffd166';
      ctx.beginPath(); ctx.arc(0,0,34,0,7); ctx.fill(); ctx.globalAlpha=1;
      ctx.fillStyle='#c78b12'; rr(-18,-12,36,26,5); ctx.fill();
      ctx.fillStyle='#ffd166'; rr(-18,-18,36,14,5); ctx.fill();
      ctx.fillStyle='#fff6d5'; rr(-3,-20,6,16,2); ctx.fill();
      ctx.fillStyle='#08121f'; ctx.font='700 18px Pretendard, sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('🎁', 0, 2); ctx.textAlign='left'; ctx.textBaseline='alphabetic';
    } else if(gm.item){
      const it = ITEMS[gm.item];
      const pulse = 1 + Math.sin(time*7)*.08;
      ctx.scale(pulse,pulse);
      ctx.globalAlpha=.3; ctx.fillStyle=it.col;
      ctx.beginPath(); ctx.arc(0,0,20,0,7); ctx.fill(); ctx.globalAlpha=1;
      ctx.fillStyle=it.col; rr(-13,-13,26,26,8); ctx.fill();
      ctx.fillStyle='#08121f'; ctx.font='700 16px Pretendard, sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(it.icon, 0, 1); ctx.textAlign='left'; ctx.textBaseline='alphabetic';
    } else {
      const g = GEMS[gm.tier];
      ctx.rotate(gm.ph*.5);
      ctx.globalAlpha=.28; ctx.fillStyle=g.glow;
      ctx.beginPath(); ctx.arc(0,0,g.r*2,0,7); ctx.fill(); ctx.globalAlpha=1;
      ctx.fillStyle=g.col;
      ctx.beginPath(); ctx.moveTo(0,-g.r); ctx.lineTo(g.r*.86,0); ctx.lineTo(0,g.r); ctx.lineTo(-g.r*.86,0);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.75)';
      ctx.beginPath(); ctx.moveTo(0,-g.r); ctx.lineTo(g.r*.4,-g.r*.25); ctx.lineTo(0,0); ctx.lineTo(-g.r*.4,-g.r*.25);
      ctx.closePath(); ctx.fill();
      if(gm.tier===3){ ctx.strokeStyle='#fff6d5'; ctx.lineWidth=1.5;
        ctx.beginPath(); ctx.arc(0,0,g.r+4,0,7); ctx.stroke(); }
    }
    ctx.restore();
    if(gm.maxLife){
      const t = Math.max(0, gm.life/gm.maxLife);
      ctx.save();
      ctx.strokeStyle = t<.28 ? '#ff6b6b' : t<.55 ? '#ffd166' : 'rgba(234,242,255,.75)';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(gm.x, gm.y, gm.item?17:(GEMS[gm.tier].r+8), -Math.PI/2, -Math.PI/2 + t*Math.PI*2);
      ctx.stroke();
      ctx.restore();
    }
  }

  /* 몬스터 */
  for(const f of ents.foes){ if(inView(f.x,f.y,f.r+20)) drawFoe(f); }
  if(ents.boss) drawBoss(ents.boss);

  /* 적 투사체 · 탄막 */
  for(const s of ents.shots){
    if(s.kind==='laser' || s.kind==='sweep'){
      ctx.save();
      ctx.globalAlpha = (s.warnT>0 || !s.active) ? (.22+Math.abs(Math.sin(time*20))*.4) : .92;
      ctx.fillStyle = (s.warnT>0 || !s.active) ? '#ffb347' : s.col;
      ctx.fillRect(s.x-s.w/2, s.y-s.h/2, s.w, s.h);
      if(s.warnT>0 || !s.active){
        ctx.strokeStyle='#fff'; ctx.lineWidth=1.5; ctx.setLineDash([6,5]);
        ctx.strokeRect(s.x-s.w/2, s.y-s.h/2, s.w, s.h);
        ctx.setLineDash([]);
      }
      ctx.restore();
      continue;
    }
    if(s.kind==='bone'){
      if(!inView(s.x,s.y,40)) continue;
      ctx.fillStyle=s.col;
      rr(s.x-s.w/2, s.y-s.h/2, s.w, s.h, 4); ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,.45)'; ctx.lineWidth=1; ctx.stroke();
      continue;
    }
    if(!inView(s.x,s.y,24)) continue;
    const rr2 = s.r||7;
    ctx.fillStyle=s.col; ctx.beginPath(); ctx.arc(s.x,s.y,rr2,0,7); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.6)'; ctx.lineWidth=1.5; ctx.stroke();
  }
  /* 내 총알 */
  for(const b of ents.bullets){
    const a = Math.atan2(b.vy,b.vx);
    ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(a);
    ctx.globalAlpha=.4; ctx.fillStyle='#4cc9f0';
    ctx.beginPath(); ctx.ellipse(-11,0,15,5,0,0,7); ctx.fill(); ctx.globalAlpha=1;
    ctx.fillStyle='#d7f7ff'; ctx.beginPath(); ctx.ellipse(0,0,8,4,0,0,7); ctx.fill();
    ctx.restore();
  }
  /* 위성 */
  const orbN = ST.orbitN();
  for(let i=0;i<orbN;i++){
    const a = time*2.1 + i*Math.PI*2/orbN;
    const ox = player.x+Math.cos(a)*86, oy = player.y+Math.sin(a)*86;
    ctx.save(); ctx.translate(ox,oy); ctx.rotate(time*6);
    ctx.globalAlpha=.35; ctx.fillStyle='#ffd166';
    ctx.beginPath(); ctx.arc(0,0,16,0,7); ctx.fill(); ctx.globalAlpha=1;
    ctx.fillStyle='#ffd166';
    for(let k=0;k<3;k++){ ctx.rotate(Math.PI*2/3);
      ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(13,-5); ctx.lineTo(13,5); ctx.closePath(); ctx.fill(); }
    ctx.fillStyle='#4a3406'; ctx.beginPath(); ctx.arc(0,0,4,0,7); ctx.fill();
    ctx.restore();
  }
  /* 파티클 */
  for(const q of ents.parts){
    ctx.globalAlpha=Math.max(0,q.life*2.6); ctx.fillStyle=q.col;
    ctx.fillRect(q.x,q.y,q.r,q.r);
  }
  ctx.globalAlpha=1;

  drawPlayer();

  /* 확산 링 */
  for(const r of rings){
    ctx.globalAlpha = Math.max(0, r.life)*.75;
    ctx.strokeStyle = r.col; ctx.lineWidth = r.w * Math.max(.2,r.life);
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, 7); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  /* 데미지 숫자 */
  ctx.textAlign='center';
  for(const n of dmgNums){
    ctx.globalAlpha = Math.min(1, n.life);
    const sc = n.crit ? 1.35 + (1-n.life)*.25 : 1;
    ctx.font = `800 ${Math.round(19*sc)}px Pretendard, sans-serif`;
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(6,11,22,.85)';
    ctx.strokeText(n.v + (n.crit?'!':''), n.x, n.y);
    ctx.fillStyle = n.crit ? '#ffd166' : '#eaf2ff';
    ctx.fillText(n.v + (n.crit?'!':''), n.x, n.y);
  }
  ctx.globalAlpha=1; ctx.textAlign='left';
  ctx.restore();

  const vg = ctx.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*.9);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,.5)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);

  /* 체력이 낮으면 붉은 경고 비네트가 맥박칩니다 */
  const hr = player.hp/player.maxHp;
  if(state===S.play && hr < .35){
    const a = (.35-hr)/.35 * (.28 + Math.sin(time*7)*.12);
    const rg = ctx.createRadialGradient(W/2,H/2,H*.28,W/2,H/2,H*.85);
    rg.addColorStop(0,'rgba(255,60,80,0)'); rg.addColorStop(1,`rgba(255,60,80,${Math.max(0,a)})`);
    ctx.fillStyle=rg; ctx.fillRect(0,0,W,H);
  }
  /* 화면 번쩍임 */
  if(flashA>0){ ctx.fillStyle=`rgba(255,255,255,${flashA*.55})`; ctx.fillRect(0,0,W,H); }
  /* 콤보 */
  if(combo>=3 && state===S.play){
    ctx.save(); ctx.textAlign='center';
    const k = Math.min(1, comboT/2.2);
    ctx.globalAlpha = .35 + k*.65;
    const sz = 30 + Math.min(combo,30)*.9;
    ctx.font = `900 ${Math.round(sz)}px Pretendard, sans-serif`;
    ctx.lineWidth=6; ctx.strokeStyle='rgba(6,11,22,.8)';
    ctx.strokeText(combo + ' COMBO', W/2, 235);
    const gcol = combo>=20 ? '#ff8fa3' : combo>=10 ? '#ffd166' : '#8ef0c4';
    ctx.fillStyle = gcol; ctx.fillText(combo + ' COMBO', W/2, 235);
    ctx.globalAlpha=1; ctx.restore();
  }
  if(ents.boss) drawBossBar();
  if(state===S.pause){
    ctx.fillStyle='rgba(4,9,18,.6)'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#eaf2ff'; ctx.font='700 44px Pretendard, sans-serif'; ctx.textAlign='center';
    ctx.fillText('일시정지',W/2,H/2); ctx.textAlign='left';
  }
}
const inView = (x,y,m)=> x>cam.x-m && x<cam.x+W+m && y>cam.y-m && y<cam.y+H+m;

function drawFoe(f){
  const fl = f.flash>0;
  const d = ENEMY[f.t] || {};
  ctx.save(); ctx.translate(f.x,f.y);
  if(f.t==='straw'){
    ctx.rotate(time*2+f.ph);
    ctx.fillStyle = fl?'#fff':'#ffd166';
    ctx.fillRect(-2,-10,4,20);
    ctx.fillStyle='#e07a3d'; ctx.fillRect(-2.5,-11,5,3);
  } else if(f.t==='pellet'){
    ctx.fillStyle = fl?'#fff':'#9be7ff';
    ctx.beginPath(); ctx.arc(0,0,6,0,7); ctx.fill();
  } else if(f.t==='bead'){
    ctx.fillStyle = fl?'#fff':'rgba(199,125,255,.9)';
    ctx.beginPath(); ctx.arc(0,0,7,0,7); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.45)'; ctx.beginPath(); ctx.arc(-2,-2,2.2,0,7); ctx.fill();
  } else if(f.t==='lid'){
    ctx.fillStyle = fl?'#fff':'#ff8a4c';
    ctx.beginPath(); ctx.arc(0,0,10,0,7); ctx.fill();
    ctx.strokeStyle='#c45c22'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(0,0,6,0,7); ctx.stroke();
  } else if(f.t==='bag'){
    ctx.fillStyle = fl?'#fff':'rgba(230,245,255,.92)';
    ctx.beginPath();
    ctx.moveTo(-16,9); ctx.quadraticCurveTo(-19,-11,-6,-13);
    ctx.lineTo(-4,-18); ctx.lineTo(0,-13); ctx.lineTo(4,-18); ctx.lineTo(6,-13);
    ctx.quadraticCurveTo(19,-11,16,9); ctx.quadraticCurveTo(0,17,-16,9); ctx.closePath(); ctx.fill();
    ctx.strokeStyle='rgba(120,170,220,.9)'; ctx.lineWidth=1.5; ctx.stroke();
  } else if(f.t==='cup'){
    ctx.fillStyle = fl?'#fff':'#f2f6fb';
    ctx.beginPath(); ctx.moveTo(-11,-13); ctx.lineTo(11,-13); ctx.lineTo(8,14); ctx.lineTo(-8,14); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#d9534f'; ctx.fillRect(-12,-17,24,6);
  } else if(f.t==='mask'){
    ctx.fillStyle = fl?'#fff':'#eef6ff';
    rr(-14,-8,28,18,8); ctx.fill();
    ctx.strokeStyle='#8aa4c2'; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(-14,0); ctx.quadraticCurveTo(-22,-6,-20,-14); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(14,0); ctx.quadraticCurveTo(22,-6,20,-14); ctx.stroke();
    ctx.fillStyle='#9bb3cc'; ctx.fillRect(-8,-1,16,3);
  } else if(f.t==='tape'){
    ctx.rotate(f.ph);
    ctx.fillStyle = fl?'#fff':'#d4a017';
    rr(-16,-5,32,10,3); ctx.fill();
    ctx.fillStyle='#8a6a12'; ctx.fillRect(-16,-1,32,2);
  } else if(f.t==='wrap'){
    ctx.fillStyle = fl?'#fff':'#c9a27a';
    rr(-18,-14,36,28,4); ctx.fill();
    ctx.fillStyle='#8b5e34'; ctx.fillRect(-18,-2,36,4);
    ctx.fillStyle='#e8d5b5'; rr(-10,-22,20,12,3); ctx.fill();
  } else if(f.t==='foam'){
    ctx.fillStyle = fl?'#fff':'#eef2f7';
    rr(-22,-20,44,40,10); ctx.fill();
    ctx.fillStyle='rgba(160,180,205,.55)';
    for(let i=0;i<6;i++) ctx.fillRect(-18+(i%3)*14, -13+Math.floor(i/3)*15, 9, 8);
  } else if(f.t==='bottle'){
    ctx.fillStyle = fl?'#fff':'rgba(120,220,255,.85)';
    rr(-11,-18,22,34,8); ctx.fill();
    ctx.fillStyle='#2b9ec9'; ctx.fillRect(-6,-24,12,7);
  } else if(f.t==='smog'){
    ctx.fillStyle = fl?'#fff':'rgba(190,160,220,.8)';
    for(let i=0;i<5;i++){ const a=i/5*6.28+time*.6;
      ctx.beginPath(); ctx.arc(Math.cos(a)*10, Math.sin(a)*8, 12, 0, 7); ctx.fill(); }
  } else if(f.t==='oil'){
    ctx.fillStyle = fl?'#fff':'rgba(40,36,28,.92)';
    ctx.beginPath();
    ctx.ellipse(0,4,18,12,0,0,7); ctx.fill();
    ctx.fillStyle='rgba(90,70,30,.7)';
    ctx.beginPath(); ctx.ellipse(-4,-2,10,7,0,0,7); ctx.fill();
  } else if(f.t==='net'){
    ctx.strokeStyle = fl?'#fff':'rgba(180,230,215,.95)'; ctx.lineWidth=2.5;
    for(let i=-22;i<=22;i+=8){ ctx.beginPath(); ctx.moveTo(i,-20); ctx.lineTo(i+5,20); ctx.stroke(); }
    for(let j=-18;j<=18;j+=8){ ctx.beginPath(); ctx.moveTo(-24,j); ctx.lineTo(24,j+3); ctx.stroke(); }
  } else if(f.t==='tire'){
    ctx.strokeStyle = fl?'#fff':'#2a2a2a'; ctx.lineWidth=10;
    ctx.beginPath(); ctx.arc(0,0,16,0,7); ctx.stroke();
    ctx.strokeStyle='#555'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(0,0,8,0,7); ctx.stroke();
  } else if(f.t==='crate'){
    ctx.fillStyle = fl?'#fff':'#8b5a2b';
    rr(-26,-22,52,44,4); ctx.fill();
    ctx.strokeStyle='#5c3a18'; ctx.lineWidth=2;
    ctx.strokeRect(-26,-22,52,44);
    ctx.beginPath(); ctx.moveTo(-26,-4); ctx.lineTo(26,-4); ctx.stroke();
    ctx.fillStyle='#c9a06a'; ctx.font='700 11px Pretendard, sans-serif';
    ctx.textAlign='center'; ctx.fillText('BOX',0,6); ctx.textAlign='left';
  }
  if(!d.swarm){
    ctx.fillStyle='#0b1220';
    ctx.beginPath(); ctx.arc(-5,-3,2.8,0,7); ctx.arc(5,-3,2.8,0,7); ctx.fill();
    if(f.hp < f.maxHp){
      ctx.fillStyle='rgba(0,0,0,.5)'; ctx.fillRect(-f.r, -f.r-11, f.r*2, 4);
      ctx.fillStyle='#ff8fa3'; ctx.fillRect(-f.r, -f.r-11, f.r*2*Math.max(0,f.hp/f.maxHp), 4);
    }
  }
  ctx.restore();
}
function drawBoss(B){
  ctx.save(); ctx.translate(B.x,B.y);
  ctx.fillStyle = B.flash>0 ? '#fff' : 'rgba(120,140,170,.94)';
  ctx.beginPath();
  for(let i=0;i<14;i++){ const a=i/14*6.28;
    const r = B.r*(.86 + Math.sin(a*3+B.ph*2)*.12);
    const px=Math.cos(a)*r, py=Math.sin(a)*r;
    i?ctx.lineTo(px,py):ctx.moveTo(px,py); }
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle='#3b5573'; ctx.lineWidth=4; ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.22)';
  for(let i=0;i<9;i++){ const a=i*1.3+B.ph*.4;
    ctx.fillRect(Math.cos(a)*38-9, Math.sin(a)*32-6, 20, 10); }
  ctx.fillStyle='#ff6b6b';
  ctx.beginPath(); ctx.arc(-22,-10,9,0,7); ctx.arc(22,-10,9,0,7); ctx.fill();
  ctx.fillStyle='#0b1220';
  ctx.beginPath(); ctx.arc(-22,-10,4,0,7); ctx.arc(22,-10,4,0,7); ctx.fill();
  ctx.restore();
}
function drawBossBar(){
  const B = ents.boss, w=560, x=(W-w)/2, y=H-52;
  ctx.fillStyle='rgba(10,18,32,.85)'; rr(x-8,y-24,w+16,46,12); ctx.fill();
  ctx.strokeStyle='#3b5573'; ctx.lineWidth=1.5; rr(x-8,y-24,w+16,46,12); ctx.stroke();
  ctx.fillStyle='#eaf2ff'; ctx.font='700 13px Pretendard, sans-serif'; ctx.textAlign='left';
  ctx.fillText('BOSS · ' + (B.name||'플라스틱 덩어리'), x, y-7);
  ctx.fillStyle='#22304a'; rr(x,y,w,14,7); ctx.fill();
  ctx.fillStyle='#ff6b6b'; rr(x,y,w*Math.max(0,B.hp/B.maxHp),14,7); ctx.fill();
}
function drawPlayer(){
  const p = player;
  /* 머즐 플래시 */
  if(p.muzzle>0){
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.mAng||0);
    ctx.globalAlpha = p.muzzle/.07;
    ctx.fillStyle='#eaf6ff';
    ctx.beginPath(); ctx.moveTo(16,0); ctx.lineTo(40,-13); ctx.lineTo(52,0); ctx.lineTo(40,13); ctx.closePath(); ctx.fill();
    ctx.globalAlpha=1; ctx.restore();
  }
  if(p.inv>0 && Math.floor(time*20)%2===0) return;
  ctx.save(); ctx.translate(p.x - Math.cos(p.mAng||0)*(p.recoil||0),
                            p.y - Math.sin(p.mAng||0)*(p.recoil||0));
  ctx.globalAlpha=.25; ctx.fillStyle='#000';
  ctx.beginPath(); ctx.ellipse(0,p.r+4,15,5,0,0,7); ctx.fill(); ctx.globalAlpha=1;
  ctx.scale(p.face,1);
  const bob = Math.sin(p.walk)*1.5;
  ctx.fillStyle='#3ddc97'; rr(-13,-4+bob,26,24,8); ctx.fill();
  ctx.fillStyle='#2bb47b'; ctx.fillRect(-13,8+bob,26,4);
  ctx.fillStyle='#ffe0bd'; rr(-11,-20+bob,22,19,7); ctx.fill();
  ctx.fillStyle='#4cc9f0'; rr(-13,-26+bob,26,10,5); ctx.fill();
  ctx.fillStyle='#132038'; ctx.beginPath(); ctx.arc(4,-11+bob,2.4,0,7); ctx.fill();
  ctx.fillStyle='#4cc9f0'; rr(8,-2+bob,14,8,3); ctx.fill();
  ctx.restore();
}
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

/* ── 루프 ── */
let last = performance.now();
function loop(now){
  const dt = Math.min(.033,(now-last)/1000); last = now;
  update(dt); render(); requestAnimationFrame(loop);
}
function paintDiff(){
  dom('diffPick').innerHTML = DIFFS.map((d,i)=>
    `<button data-i="${i}" class="${i===DIFF?'sel':''}">${d.name}</button>`).join('');
  dom('diffPick').querySelectorAll('button').forEach(b=>b.onclick=()=>{ DIFF=+b.dataset.i; paintDiff(); });
}
paintDiff();
function fit(){
  const r = Math.min(innerWidth/W, innerHeight/H);
  const f = dom('frame'); f.style.width=(W*r)+'px'; f.style.height=(H*r)+'px';
}
addEventListener('resize', fit); fit();
requestAnimationFrame(loop);
</script>
